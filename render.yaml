# Render — déploiement Prima Center (frontend + API)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: prima-center
    runtime: node
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
