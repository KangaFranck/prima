# fly.toml app configuration file generated for primacenter on 2025-09-19T14:59:06+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'primacenter'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[env]
  POCKETBASE_ENV = 'production'

[[mounts]]
  source = 'pb_data'
  destination = '/app/pb_data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '10s'
    grace_period = '60s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
